<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم · Doctoreto</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://vzhlnugxuojpyjosrmep.supabase.co; media-src blob:; connect-src https://vzhlnugxuojpyjosrmep.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="dashboard.css"></head>
<body>
<header><b>لوحة التحكم · Doctoreto</b><nav id="tabs" hidden><button data-t="cases" class="on">الحالات</button><button data-t="spec">التخصصات</button><button data-t="prof">الملف الشخصي</button><button data-t="ct">التواصل</button><button id="out">خروج</button></nav></header>
<main>
<section id="login"><h2>تسجيل الدخول</h2>
<label>البريد<input id="em" type="email" autocomplete="username"></label>
<label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label>
<button id="go">دخول</button><p id="lerr" class="err"></p></section>
<section id="cases" class="tab" hidden><div id="meter" class="card"></div>
<h2>حالة جديدة</h2>
<div class="form">
<label>العنوان بالعربي<input id="ta" maxlength="120"></label>
<label>Title in English<input id="te" maxlength="120" dir="ltr"></label>
<label>التخصص<select id="sp"></select></label>
<label>الوصف بالعربي<textarea id="da" maxlength="1000"></textarea></label>
<label>Description in English<textarea id="de" maxlength="1000" dir="ltr"></textarea></label>
<button id="add">إضافة كمسودة</button><p id="aerr" class="err"></p></div>
<h2>الحالات</h2><div id="list"></div></section>
<section id="spec" class="tab" hidden><h2>التخصصات</h2><p class="hint">فعّل التخصص ليظهر في القائمة وتصبح له صفحة. المقفول لا يظهر للزوار.</p><button id="splus" class="plus" title="إضافة تخصص جديد"><span>+</span> إضافة تخصص جديد</button><div id="sform" class="card" hidden><label>الاسم بالعربي<input id="sna" maxlength="80"></label><label>Name in English<input id="sne" maxlength="80" dir="ltr"></label><label>مقدمة قصيرة بالعربي (اختياري)<textarea id="sia" maxlength="1500"></textarea></label><label>Short intro in English (optional)<textarea id="sie" maxlength="1500" dir="ltr"></textarea></label><p class="hint">يتضاف مقفول، ما يظهر للزوار إلا لما تفعّله.</p><button id="sadd">إضافة</button> <button id="scan" class="sec">إلغاء</button><p id="smsg" class="err"></p></div><div id="slist"></div></section>
<section id="prof" class="tab" hidden><h2>الملف الشخصي (الصفحة الرئيسية)</h2>
<div class="card"><b>صورتك</b><div id="pphoto" class="pimg"></div><input id="pfile" type="file" accept="image/jpeg,image/png,image/webp"><button id="pup" class="sec">رفع الصورة</button><p id="pmsg" class="err"></p></div>
<div class="card"><label>النبذة بالعربي<textarea id="ba" maxlength="1500"></textarea></label><label>Bio in English<textarea id="be" maxlength="1500" dir="ltr"></textarea></label><button id="bsave">حفظ النبذة</button><p id="bmsg" class="err"></p></div></section>
<section id="ct" class="tab" hidden><h2>التواصل (صفحة تواصل)</h2><div class="card"><label>النوع<select id="ck"><option value="phone">رقم هاتف</option><option value="social">رابط سوشيال ميديا (https فقط)</option></select></label><label>الاسم (اختياري للهاتف)<input id="cl" maxlength="40"></label><label>الرقم أو الرابط<input id="cv" maxlength="200" dir="ltr"></label><button id="cadd">إضافة</button><p id="cmsg" class="err"></p></div><div id="ctl"></div></section>
</main>
<script src="dashboard.js"></script></body></html>
